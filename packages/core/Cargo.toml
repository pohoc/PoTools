[package]
name = "potools-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
# `EngineEvent` pairs a large `JobUpdated { job }` payload with a tiny `Log`.
# Values are constructed once per event and serialized immediately, never held
# in a collection where the variant size would matter; boxing would add
# indirection at every construction site for no runtime benefit.
large_enum_variant = "allow"
