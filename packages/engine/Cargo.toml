[package]
name = "potools-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
native = ["dep:hickory-resolver"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys", "getrandom/wasm_js", "uuid/js"]

[dependencies]
potools-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde-saphyr = { version = "1", default-features = false, features = ["serialize", "deserialize"] }
url = "2"
base64 = "0.22"
bcrypt = "0.19"
fancy-regex = "0.19"
regex = "1"
hickory-resolver = { version = "0.24.4", default-features = true, optional = true }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
blake2 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
pbkdf2 = "0.12"
scrypt = "0.11"
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["encryption"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
x509-parser = "0.16"
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "v7"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp", "tiff"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "=0.45.0", default-features = false }
ttf-parser = "0.25"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
subsetter = "0.2.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints.clippy]
# Tool entry points receive their option surface as positional parameters by
# design and are called once from the dispatch table; grouping them into structs
# is a pure refactor with no behavior change, so it is not gated here.
too_many_arguments = "allow"
# `Key` (rsa) and `FontKind` (pdfdoc) hold a small variant next to a
# deliberately large one. Both values are short-lived and never stored in
# collections where the size difference would matter; boxing would only add
# indirection to every use site.
large_enum_variant = "allow"

# This package is its own workspace root, so its release profile is what
# `pnpm wasm:build` compiles with (the desktop host applies the profile in
# apps/desktop/Cargo.toml instead, which already sets LTO/strip). Without it the
# browser engine shipped at the default opt-level=3 / no-LTO / unstripped size.
# Size beats speed here: the module is parsed on every app start and is the
# single largest asset in the bundle.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
