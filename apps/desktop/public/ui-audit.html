<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>UI audit</title>
    <style>
      body { margin: 0; background: #eceef3; font: 12px/1.5 ui-monospace, Menlo, monospace; }
      #report { padding: 10px 14px; background: #111827; color: #e5e7eb; white-space: pre; }
      .frame { margin: 14px; border: 1px solid #cbd2dd; background: #fff; box-shadow: 0 6px 24px -12px rgba(15,23,42,.35); }
      .frame h2 { margin: 0; padding: 6px 10px; font-size: 11px; color: #475569; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
      iframe { display: block; border: 0; width: 100%; height: 860px; }
    </style>
  </head>
  <body>
    <div id="report">running…</div>
    <script>
      const route = location.hash.slice(1) || '/';
      const widths = [1440, 1180, 1024, 900, 780];
      const report = [];

      async function audit(width) {
        const host = document.createElement('div');
        host.className = 'frame';
        host.style.width = width + 'px';
        const title = document.createElement('h2');
        title.textContent = `${width}px  ${route}`;
        const frame = document.createElement('iframe');
        frame.src = `/#${route.startsWith('/') ? route : `/${route}`}`;
        host.append(title, frame);
        document.body.append(host);
        await new Promise((resolve) => {
          frame.addEventListener('load', () => setTimeout(resolve, 1400));
        });
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const root = doc.documentElement;
        const body = doc.body;
        const overflowX = Math.max(root.scrollWidth, body.scrollWidth) - root.clientWidth;
        // A container that only clips absolutely positioned decoration (the blurred
        // hero glow) is not a layout defect; report text or in-flow children that
        // really do exceed the box.
        const ownText = (el) => [...el.childNodes].some((node) => node.nodeType === 3 && node.textContent.trim().length);
        const inFlowOverflow = (el) => {
          const rect = el.getBoundingClientRect();
          const style = getComputedStyle(el);
          const contentRight = rect.right - parseFloat(style.paddingRight || '0') - parseFloat(style.borderRightWidth || '0');
          return [...el.children].some((child) => {
            const cs = getComputedStyle(child);
            if (cs.position === 'absolute' || cs.position === 'fixed') return false;
            return child.getBoundingClientRect().right > contentRight + 2;
          });
        };
        const clipped = [...doc.querySelectorAll('*')]
          .filter((el) => el.scrollWidth > el.clientWidth + 2 && getComputedStyle(el).overflowX !== 'auto' && getComputedStyle(el).overflowX !== 'scroll')
          .filter((el) => ownText(el) || inFlowOverflow(el))
          .filter((el) => el.textContent.trim().length && el.getBoundingClientRect().width > 0)
          .slice(0, 6)
          .map((el) => `${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ')[0]} sw=${el.scrollWidth} cw=${el.clientWidth} "${el.textContent.trim().slice(0, 24)}"`);
        const offscreen = [...doc.querySelectorAll('button, a, input, select')]
          .map((el) => el.getBoundingClientRect())
          .filter((rect) => rect.width && (rect.right > width + 1 || rect.left < -1))
          .slice(0, 4)
          .map((rect) => `right=${Math.round(rect.right)} left=${Math.round(rect.left)}`);
        const textOverflow = [...doc.querySelectorAll('h1,h2,h3,span.block,p')]
          .filter((el) => {
            const s = getComputedStyle(el);
            return s.textOverflow === 'ellipsis' && el.scrollWidth > el.clientWidth + 1;
          })
          .slice(0, 5)
          .map((el) => `truncated "${el.textContent.trim().slice(0, 22)}"`);
        report.push(
          `${String(width).padStart(4)}px  overflowX=${overflowX}px  controls=${doc.querySelectorAll('button,input,select').length}  ` +
            `clipped=${clipped.length} offscreen=${offscreen.length} ellipsis=${textOverflow.length}`,
        );
        clipped.forEach((line) => report.push(`      clipped: ${line}`));
        offscreen.forEach((line) => report.push(`      offscreen: ${line} ${win.innerWidth}`));
        textOverflow.forEach((line) => report.push(`      ${line}`));
      }

      (async () => {
        for (const width of widths) await audit(width);
        document.getElementById('report').textContent = `route ${route}\n` + report.join('\n');
      })();
    </script>
  </body>
</html>
