[package]
name = "potools"
version = "0.1.0"
license = "MIT"
description = "PoTools 本机文件处理工作台"
authors = ["pohoc <po.hoc4@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "potools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4"] }
potools-engine = { path = "../../packages/engine" }

[profile.release]
# codegen-units=4：LTO 后代码生成并行化（本地实测全量 -13%、重编链接 -15%），
# 体积代价 +2.0%（≈300KB），远小于 thin LTO 的 +38%
codegen-units = 4
lto = true
opt-level = "s"
strip = true
