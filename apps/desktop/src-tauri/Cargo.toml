[package]
name = "potools"
version = "0.1.0"
license = "MIT"
description = "PoTools 本机文件处理工作台"
authors = ["pohoc <po.hoc4@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "potools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
