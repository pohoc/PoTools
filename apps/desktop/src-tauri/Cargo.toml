[package]
name = "potools"
version = "0.1.0"
license = "MIT"
description = "PoTools 本机文件处理工作台"
authors = ["pohoc <po.hoc4@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "potools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
node-embed = []

[build-dependencies]
cc = "1.2"
serde_json = "1"
sha2 = "0.10.9"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4"] }
hickory-resolver = { version = "0.24.4", default-features = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
