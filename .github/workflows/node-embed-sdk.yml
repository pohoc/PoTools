name: Build Node embed SDK

on:
  push:
    branches: [po/node-embed-sdk-build]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            node: 22.20.0
            target: x86_64-pc-windows-msvc
          - architecture: x86
            node: 20.20.2
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}
      - name: Fetch pinned Node source
        shell: pwsh
        run: git clone --depth 1 --branch "v${{ matrix.node }}" https://github.com/nodejs/node.git node-source
      - name: Build and export static Node SDK
        shell: pwsh
        run: ./scripts/build-node-embed-sdk.ps1 -Architecture ${{ matrix.architecture }} -NodeSourceRoot ./node-source -OutputRoot ./node-sdk
      - name: Build and run the one-file Windows app
        shell: pwsh
        env:
          POTOOLS_NODE_EMBED_SDK_ROOT: ${{ github.workspace }}\node-sdk
        run: |
          pnpm run package:windows:${{ matrix.architecture }}:build
          node scripts/package-windows-portable.mjs ${{ matrix.architecture }}
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: potools-windows-${{ matrix.architecture }}-portable
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/PoTools_*_windows_${{ matrix.architecture }}-portable.zip
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-embed-sdk-${{ matrix.architecture }}-diagnostics
          path: node-sdk/.node-embed-sdk-*/*.log
          if-no-files-found: ignore
          include-hidden-files: true
