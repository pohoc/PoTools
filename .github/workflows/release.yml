name: Release

# 纯发版流水线：仅推 tag（v*）触发，产物自动上传到 GitHub Release（draft）。
# 测试验证走 CI（ci.yml，push/PR 触发）；发版前可用 CI + draft Release 检查产物。
# 重复推同一 tag 时自动取消仍在跑的旧一轮。

on:
  push:
    tags:
      - 'v*'

# 版本戳在 stamp job 算一次，全链所有产物统一使用。
# 戳为 Asia/Shanghai 的 MMDDHHMM；版本号也从 tag 推导（v0.2.0 -> 0.2.0），
# 产物名与 updater 清单都由它拼出，不再硬编码某个具体版本（REL-01）。

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 版本戳 + 版本号（全链统一） ──────────────────────────────────────
  # 下游产物名依赖这里：Tauri/electron-builder 用 manifest 版本命名，tag 与
  # root package.json 不一致时在这里先失败，而不是等 publish 找不到文件。

  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: stamp
        run: echo "stamp=$(TZ=Asia/Shanghai date +'%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Derive release version from tag
        id: version
        run: |
          set -euo pipefail
          version="$(node scripts/release-version.mjs "${GITHUB_REF_NAME}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "[release] artifact version ${version} (tag ${GITHUB_REF_NAME})"

  # ── 前端产物只构建一次（桌面变体 + Win7 浏览器变体），各平台只做原生构建 ──

  prepare:
    runs-on: ubuntu-latest
    needs: stamp
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable (wasm32 for engine WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: potools-rust
          workspaces: packages/engine
          cache-on-failure: true

      - name: Install wasm-bindgen-cli (prebuilt)
        shell: bash
        env:
          WBV: 0.2.129
        run: |
          set -e
          curl -fsSLo /tmp/wb.tar.gz "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBV}/wasm-bindgen-${WBV}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf /tmp/wb.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WBV}-x86_64-unknown-linux-musl"/* "$HOME/.cargo/bin/"
          wasm-bindgen --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # REL-01 的另一半：stamp 已把 tag 与 root 版本对齐，这里确认所有 manifest 也
      # 对齐——Tauri/electron-builder 的产物名取自 manifest（tauri.conf.json 等），
      # 不是取自 tag；两边不一致时 publish 就会找不到文件。
      - name: Verify manifest versions
        run: pnpm version:check

      - name: Warm cargo registry (wasm:build uses --offline)
        run: cargo fetch --manifest-path packages/engine/Cargo.toml

      - name: Build engine WASM
        run: pnpm wasm:build

      # 前端只构建一次。桌面/浏览器两版唯一差异是 dist/fonts（~17MB 浏览器字体，
      # 桌面版由系统字体桥替代）：浏览器版原样给 Win7，桌面版拷贝一份删 fonts 即可。
      - name: Build web (single source build)
        run: pnpm --filter @potools/web build

      - name: Upload browser web dist (Win7 uses this as-is)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-browser
          path: apps/web/dist

      - name: Derive desktop dist (drop browser-only fonts — no rebuild)
        run: |
          cp -r apps/web/dist /tmp/dist-desktop
          rm -rf /tmp/dist-desktop/fonts
          echo "desktop dist derived (fonts dropped)"

      - name: Upload desktop web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-desktop
          path: /tmp/dist-desktop

  # ── Tauri 原生构建（消费 prepare 的 web dist，只做平台原生构建） ────────

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            arch: 'macos-x64'
            rust-targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --config tauri.ci.conf.json'
            bundles: |
              apps/desktop/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: 'ubuntu-22.04'
            arch: 'linux'
            rust-targets: ''
            args: '--target x86_64-unknown-linux-gnu --config tauri.ci.conf.json'
            bundles: |
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig
              apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig
          - platform: 'windows-latest'
            arch: 'windows-x64'
            rust-targets: ''
            args: '--target x86_64-pc-windows-msvc --config tauri.ci.conf.json'
            bundles: |
              apps/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              apps/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          # 32 位 Windows：`scripts/collect-release-artifacts.mjs` 与两份 `说明.txt`
          # 都登记了 x86 安装包，缺这条矩阵就会在 publish 改名阶段才暴露「产不出该文件」。
          - platform: 'windows-latest'
            arch: 'windows-x86'
            rust-targets: 'i686-pc-windows-msvc'
            args: '--target i686-pc-windows-msvc --config tauri.ci.conf.json'
            bundles: |
              apps/desktop/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
              apps/desktop/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.platform }}
    needs: [stamp, prepare]
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      # mold 链接器：fat LTO 链接阶段的并行加速（仅 linux；首次运行因缓存
      # 指纹变化多一次全量重编，之后每轮省 1-2 分钟）
      RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-fuse-ld=mold' || '' }}
    steps:
      # Windows runner 的 Defender 实时扫描会逐个检查 target 下数万个编译产物，
      # 是 Rust CI 在 Windows 上最大的拖累。但新镜像的 Tamper Protection 会拒绝
      # Set-MpPreference，故整步 continue-on-error：能关则提速，关不掉照常构建。
      - name: Disable Windows Defender realtime scan (Rust CI speedup, best-effort)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$(Get-Location)" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Per-entry: the macOS job cross-builds x86_64 and the Windows x86 job
          # needs i686-pc-windows-msvc; both are non-default targets.
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: potools-rust
          workspaces: |
            packages/engine
            apps/desktop
          # 失败也保存缓存：否则 Windows 一次红构建就丢掉整棵依赖树，
          # 下次又要 30+ 分钟冷编译（本次 39 分钟的教训）。
          cache-on-failure: true

      - name: Install Linux deps (Tauri v2 + WebKitGTK 4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf mold

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared web dist (built once in prepare)
        uses: actions/download-artifact@v4
        with:
          name: web-dist-desktop
          path: apps/web/dist

      # 直接构建（不经 tauri-action）：产物留在工作区打包目录，由 publish
      # 统一「下载 artifact → 本地打戳改名 → 建草稿一次性上传」。
      # updater 产物（setup.exe / .app.tar.gz / AppImage）在此用 minisign
      # 私钥签名；公钥在 tauri.conf.json（可提交），私钥只在仓库 secret。
      - name: Build desktop bundles (tauri)
        env:
          POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm --filter @potools/desktop tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # ── Windows 7 兼容包（Electron 22 ia32；消费 prepare 的浏览器变体 dist） ─

  build-win7:
    runs-on: windows-latest
    needs: [stamp, prepare]
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared web dist (browser variant, built once in prepare)
        uses: actions/download-artifact@v4
        with:
          name: web-dist-browser
          path: apps/web/dist

      - name: Sync dist to Win7 shell
        run: pnpm --filter @potools/legacy-win7 sync-dist

      - name: Build ia32 NSIS installer
        run: pnpm --filter @potools/legacy-win7 dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-setup
          path: apps/legacy-win7/release/*.exe

  # ── 收尾：下载各平台 bundle artifact → 本地打戳改名 → 建草稿一次性上传 ──
  # 全程基于本地文件操作，对 release 资产列表 API 零依赖（该列表有分钟级
  # 传播延迟与并发写入不一致，曾连续两轮在它上面翻车）。
  # 更新清单从三个 .sig 签名文件组装（三平台齐全），官方直连 + 国内双镜像
  # （镜像的资产 URL 包同源代理前缀，清单与下载同源）。

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [stamp, build-tauri, build-win7]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAMP: ${{ needs.stamp.outputs.stamp }}
      # REL-01：产物名与清单 URL 都拼这个版本号（stamp 已从 tag 推导并与 manifest
      # 对齐）。写死具体版本的旧写法在非该版本的演练 tag 上必然找不到文件。
      VERSION: ${{ needs.stamp.outputs.version }}
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: bundles

      - name: Download win7 installer
        uses: actions/download-artifact@v4
        with:
          name: win7-setup
          path: win7

      - name: Stamp and organize assets
        run: |
          set -euo pipefail
          # upload-artifact 多 glob 会按最小公共祖先保留子目录（bundles/dmg/…、
          # bundles/macos/…），先拍平到 bundles 根再打戳改名。
          find bundles -type f -exec mv {} bundles/ \;
          find bundles -mindepth 1 -type d -empty -delete
          # 名字对不上时给出可诊断的信息，而不是只留一句 mv: No such file。
          move() {
            if [ ! -f "$1" ]; then
              echo "::error::缺少预期产物 $1（version=${VERSION} stamp=${STAMP}）"
              echo "--- bundles/:"; ls -1 bundles/ || true
              echo "--- win7/:"; ls -1 win7/ || true
              exit 1
            fi
            mv "$1" "$2"
          }
          mkdir -p out
          move bundles/PoTools_${VERSION}_x64.dmg              "out/PoTools_${VERSION}-${STAMP}_x64.dmg"
          move bundles/PoTools.app.tar.gz                      "out/PoTools_${VERSION}-${STAMP}_x64.app.tar.gz"
          move bundles/PoTools.app.tar.gz.sig                  "out/PoTools_${VERSION}-${STAMP}_x64.app.tar.gz.sig"
          move bundles/PoTools_${VERSION}_x64-setup.exe        "out/PoTools_${VERSION}-${STAMP}_x64-setup.exe"
          move bundles/PoTools_${VERSION}_x64-setup.exe.sig    "out/PoTools_${VERSION}-${STAMP}_x64-setup.exe.sig"
          move bundles/PoTools_${VERSION}_x86-setup.exe        "out/PoTools_${VERSION}-${STAMP}_x86-setup.exe"
          move bundles/PoTools_${VERSION}_x86-setup.exe.sig    "out/PoTools_${VERSION}-${STAMP}_x86-setup.exe.sig"
          move bundles/PoTools_${VERSION}_amd64.AppImage       "out/PoTools_${VERSION}-${STAMP}_amd64.AppImage"
          move bundles/PoTools_${VERSION}_amd64.AppImage.sig   "out/PoTools_${VERSION}-${STAMP}_amd64.AppImage.sig"
          move bundles/PoTools_${VERSION}_amd64.deb            "out/PoTools_${VERSION}-${STAMP}_amd64.deb"
          move bundles/PoTools_${VERSION}_amd64.deb.sig        "out/PoTools_${VERSION}-${STAMP}_amd64.deb.sig"
          move bundles/PoTools-${VERSION}-1.x86_64.rpm         "out/PoTools_${VERSION}-${STAMP}_x86_64.rpm"
          move bundles/PoTools-${VERSION}-1.x86_64.rpm.sig     "out/PoTools_${VERSION}-${STAMP}_x86_64.rpm.sig"
          move win7/PoTools_${VERSION}-win7-ia32-setup.exe     "out/PoTools_${VERSION}-${STAMP}_win7-ia32-setup.exe"
          echo "=== 打戳后产物:"
          ls out/

      - name: Create draft release and upload
        run: |
          set -euo pipefail
          # 清掉历史遗留的同名草稿（tag 重指后旧草稿会残留）
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"${GITHUB_REF_NAME}\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" >/dev/null \
                  && echo "removed old draft $id"
              done
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "PoTools ${GITHUB_REF_NAME}" \
            --notes "所有工具在本机运行，不需要网络。" \
            --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}"

      - name: Generate updater manifests (all platforms)
        run: |
          set -euo pipefail
          gen() {
            proxy="$1"; out="$2"
            jq -n \
              --arg version "${VERSION}" \
              --arg notes "所有工具在本机运行，不需要网络。" \
              --arg repo "${GITHUB_REPOSITORY}" --arg tag "${GITHUB_REF_NAME}" \
              --arg proxy "$proxy" --arg stamp "$STAMP" \
              --rawfile darwinsig "out/PoTools_${VERSION}-${STAMP}_x64.app.tar.gz.sig" \
              --rawfile winsig "out/PoTools_${VERSION}-${STAMP}_x64-setup.exe.sig" \
              --rawfile linuxsig "out/PoTools_${VERSION}-${STAMP}_amd64.AppImage.sig" \
              '{
                version: $version, notes: $notes,
                pub_date: (now | todateiso8601),
                platforms: {
                  "windows-x86_64": { signature: $winsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_" + $version + "-" + $stamp + "_x64-setup.exe") },
                  "darwin-x86_64": { signature: $darwinsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_" + $version + "-" + $stamp + "_x64.app.tar.gz") },
                  "linux-x86_64": { signature: $linuxsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_" + $version + "-" + $stamp + "_amd64.AppImage") }
                }
              }' > "$out"
          }
          gen "" latest.json
          gen "https://gh-proxy.com/" latest-cn.json
          gen "https://ghfast.top/" latest-cn-ghfast.json
          gh release upload "${GITHUB_REF_NAME}" latest.json latest-cn.json latest-cn-ghfast.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
          echo "=== manifest URLs:"
          jq -r '.platforms | to_entries[] | "  \(.key): \(.value.url)"' latest.json
