name: Release

# 纯发版流水线：仅推 tag（v*）触发，产物自动上传到 GitHub Release（draft）。
# 测试验证走 CI（ci.yml，push/PR 触发）；发版前可用 CI + draft Release 检查产物。
# 重复推同一 tag 时自动取消仍在跑的旧一轮。

on:
  push:
    tags:
      - 'v*'

# 版本戳在 stamp job 算一次，全链所有产物统一使用。
# 正式版本号来自 git tag（v0.1.0），戳为 Asia/Shanghai 的 MMDDHHMM。

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 版本戳（全链统一） ────────────────────────────────────────────────

  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: echo "stamp=$(TZ=Asia/Shanghai date +'%m%d%H%M')" >> "$GITHUB_OUTPUT"

  # ── 前端产物只构建一次（桌面变体 + Win7 浏览器变体），各平台只做原生构建 ──

  prepare:
    runs-on: ubuntu-latest
    needs: stamp
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable (wasm32 for engine WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: potools-rust
          workspaces: packages/engine
          cache-on-failure: true

      - name: Install wasm-bindgen-cli (prebuilt)
        shell: bash
        env:
          WBV: 0.2.129
        run: |
          set -e
          curl -fsSLo /tmp/wb.tar.gz "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBV}/wasm-bindgen-${WBV}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf /tmp/wb.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WBV}-x86_64-unknown-linux-musl"/* "$HOME/.cargo/bin/"
          wasm-bindgen --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Warm cargo registry (wasm:build uses --offline)
        run: cargo fetch --manifest-path packages/engine/Cargo.toml

      - name: Build engine WASM
        run: pnpm wasm:build

      # 前端只构建一次。桌面/浏览器两版唯一差异是 dist/fonts（~17MB 浏览器字体，
      # 桌面版由系统字体桥替代）：浏览器版原样给 Win7，桌面版拷贝一份删 fonts 即可。
      - name: Build web (single source build)
        run: pnpm --filter @potools/web build

      - name: Upload browser web dist (Win7 uses this as-is)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-browser
          path: apps/web/dist

      - name: Derive desktop dist (drop browser-only fonts — no rebuild)
        run: |
          cp -r apps/web/dist /tmp/dist-desktop
          rm -rf /tmp/dist-desktop/fonts
          echo "desktop dist derived (fonts dropped)"

      - name: Upload desktop web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-desktop
          path: /tmp/dist-desktop

      # 预创建草稿 Release：三个 tauri-action 并发 get-or-create 会竞态出多个
      # release 对象（曾导致 Windows/Linux 资产落到孤儿草稿、发布页缺资产）。
      # 先建好，后续 job 全部命中「已存在」路径；重推 tag 时已存在则容忍。
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --title "PoTools ${GITHUB_REF_NAME}" \
            --notes "所有工具在本机运行，不需要网络。" \
            --repo "${GITHUB_REPOSITORY}" || echo "draft release already exists"

  # ── Tauri 原生构建（消费 prepare 的 web dist，只做平台原生构建） ────────

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --config apps/desktop/tauri.ci.conf.json'
          - platform: 'ubuntu-22.04'
            args: '--config apps/desktop/tauri.ci.conf.json'
          - platform: 'windows-latest'
            args: '--config apps/desktop/tauri.ci.conf.json'
    runs-on: ${{ matrix.platform }}
    needs: [stamp, prepare]
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: potools-rust
          workspaces: |
            packages/engine
            apps/desktop
          # 失败也保存缓存：否则 Windows 一次红构建就丢掉整棵依赖树，
          # 下次又要 30+ 分钟冷编译（本次 39 分钟的教训）。
          cache-on-failure: true

      - name: Install Linux deps (Tauri v2 + WebKitGTK 4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared web dist (built once in prepare)
        uses: actions/download-artifact@v4
        with:
          name: web-dist-desktop
          path: apps/web/dist

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
          # updater 产物（setup.exe / .app.tar.gz / AppImage）打包期用 minisign 私钥签名：
          # 公钥在 tauri.conf.json（可提交），私钥只在仓库 secret。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # tag 推送（v*）→ 构建并上传到 GitHub Release（draft）
          # workflow_dispatch → 仅构建验证，不创建 Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('PoTools {0}', github.ref_name) || '' }}
          releaseBody: |
            所有工具在本机运行，不需要网络。
            - **Windows 10/11（x64）标准版**：`PoTools_<版本>-<构建戳>_x64-setup.exe`
            - **Windows 7 兼容版**（Electron 22，32 位，浏览器模式功能集）：`PoTools_<版本>-<构建戳>_win7-ia32-setup.exe`
            - **macOS（Intel）**：`PoTools_<版本>-<构建戳>_x64.dmg`
            - **Linux**：`.AppImage` / `.deb` / `.rpm`
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # ── Windows 7 兼容包（Electron 22 ia32；消费 prepare 的浏览器变体 dist） ─

  build-win7:
    runs-on: windows-latest
    needs: [stamp, prepare]
    permissions:
      contents: write
    env:
      POTOOLS_BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared web dist (browser variant, built once in prepare)
        uses: actions/download-artifact@v4
        with:
          name: web-dist-browser
          path: apps/web/dist

      - name: Sync dist to Win7 shell
        run: pnpm --filter @potools/legacy-win7 sync-dist

      - name: Build ia32 NSIS installer
        run: pnpm --filter @potools/legacy-win7 dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win7-setup
          path: apps/legacy-win7/release/*.exe

  # ── 收尾：统一产物命名（与本地 collect-release-artifacts 一致） ────────
  # tauri-action 上传的是 Tauri 默认命名（PoTools_0.1.0_x64-setup.exe，无构建戳）；
  # 这里按本地约定重命名为 PoTools_<版本>-<MMDDHHMM>_<…>，并把 Win7 包补进 Release。
  # 仅 tag 推送执行；workflow_dispatch 没有 Release，Win7 包留在 workflow artifact。

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [stamp, build-tauri, build-win7]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      # 资产列表有分钟级传播延迟（上一轮曾因此把未打戳的新资产当残留误扫）。
      # 先等列表条数连续两次轮询不变（上传传播完毕）再动手。
      - name: Wait for asset uploads to settle
        run: |
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::no release found for ${GITHUB_REF_NAME}"; exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          prev=-1
          for i in $(seq 1 18); do
            cur=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq 'length')
            echo "poll $i: $cur assets"
            if [ "$cur" = "$prev" ] && [ "$cur" != "0" ]; then break; fi
            prev=$cur; sleep 10
          done

      # 改名循环跑两遍：第二遍兜住第一遍之后才传播可见的资产。
      # 每遍先删带旧戳的产物（PoTools_x.y.z-<旧戳>_…，每轮只留最新一代），
      # 再统一打戳；未打戳资产只改名、绝不删除（可能是晚到的本轮资产）。
      - name: Rename release assets with build stamp
        run: |
          for pass in 1 2; do
            echo "── rename pass $pass"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
              old_stamp=$(printf '%s' "$name" | sed -nE 's/^PoTools_[0-9.]+-([0-9]{8})_.*/\1/p')
              if [ -n "$old_stamp" ] && [ "$old_stamp" != "$STAMP" ]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" >/dev/null \
                  && echo "removed stale build ${name}" || echo "::warning::delete failed: ${name}"
                continue
              fi
              new=$(printf '%s' "$name" | sed -E "s/^(PoTools_[0-9][0-9.]*)_/\\1-${STAMP}_/")
              case "$name" in
                *.rpm|*.rpm.sig)
                  new=$(printf '%s' "$name" | sed -E "s/^PoTools-([0-9][0-9.]*)-[0-9]+\.(.+)\.rpm(\.sig)?$/PoTools_\\1-${STAMP}_\\2.rpm\\3/") ;;
              esac
              if [ "$new" != "$name" ]; then
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" -f name="$new" >/dev/null \
                  && echo "renamed ${name} -> ${new}" || echo "::warning::rename failed: ${name}"
              fi
            done
            sleep 5
          done

      # 自动更新清单：三个平台 job 并发生成的 latest.json 会互相覆盖（最终只剩
      # 单平台条目），所以这里不信任它——直接从三个 .sig 签名文件组装三平台
      # 齐全的清单。官方直连 + 两份国内镜像（镜像的资产 URL 包同源代理前缀，
      # 清单与下载同源）；版本/说明字段取自 tauri-action 的 base latest.json。
      - name: Generate updater manifests (all platforms)
        run: |
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n1)
          dl() {
            local aid
            aid=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
              --jq ".[] | select(.name == \"$1\") | .id")
            if [ -z "$aid" ]; then
              echo "::error::asset missing: $1"; exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" \
              -H "Accept: application/octet-stream" > "$2"
          }
          dl "PoTools_x64.app.tar.gz.sig" darwin.sig
          dl "PoTools_0.1.0-${STAMP}_x64-setup.exe.sig" windows.sig
          dl "PoTools_0.1.0-${STAMP}_amd64.AppImage.sig" linux.sig
          dl "latest.json" base.json
          gen() {
            proxy="$1"; out="$2"
            jq -n \
              --arg version "$(jq -r '.version' base.json)" \
              --arg notes "$(jq -r '.notes // ""' base.json)" \
              --arg repo "${GITHUB_REPOSITORY}" --arg tag "${GITHUB_REF_NAME}" \
              --arg proxy "$proxy" --arg stamp "$STAMP" \
              --rawfile darwinsig darwin.sig --rawfile winsig windows.sig --rawfile linuxsig linux.sig \
              '{
                version: $version, notes: $notes,
                pub_date: (now | todateiso8601),
                platforms: {
                  "windows-x86_64": { signature: $winsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_0.1.0-" + $stamp + "_x64-setup.exe") },
                  "darwin-x86_64": { signature: $darwinsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_x64.app.tar.gz") },
                  "linux-x86_64": { signature: $linuxsig,
                    url: ($proxy + "https://github.com/" + $repo + "/releases/download/" + $tag + "/PoTools_0.1.0-" + $stamp + "_amd64.AppImage") }
                }
              }' > "$out"
          }
          gen "" latest.json
          gen "https://gh-proxy.com/" latest-cn.json
          gen "https://ghfast.top/" latest-cn-ghfast.json
          gh release upload "${GITHUB_REF_NAME}" latest.json latest-cn.json latest-cn-ghfast.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
          echo "=== manifest URLs:"
          jq -r '.platforms | to_entries[] | "  \(.key): \(.value.url)"' latest.json

      - name: Download win7 installer
        uses: actions/download-artifact@v4
        with:
          name: win7-setup
          path: win7

      - name: Upload stamped win7 installer to release
        run: |
          for f in win7/*.exe; do
            base="$(basename "$f")"
            new="$(printf '%s' "$base" | sed -E "s/^(PoTools_[0-9][0-9.]*)-win7/\\1-${STAMP}_win7/")"
            mv "$f" "win7/${new}"
            gh release upload "${GITHUB_REF_NAME}" "win7/${new}" --clobber --repo "${GITHUB_REPOSITORY}"
            echo "uploaded ${new}"
          done
